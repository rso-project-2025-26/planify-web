<header class="header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo" (click)="navigateTo('/')">
      <span class="logo-text">Planify</span>
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 4H5C3.89543 4 3 4.89543 3 6V20C3 21.1046 3.89543 22 5 22H19C20.1046 22 21 21.1046 21 20V6C21 4.89543 20.1046 4 19 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop">
      <a 
        class="nav-link" 
        [class.active]="isActive('/events')"
        (click)="navigateTo('/events')">
        Events
      </a>
      <a 
        class="nav-link" 
        [class.active]="isActive('/dashboard')"
        (click)="navigateTo('/dashboard')">
        Dashboard
      </a>
      <a 
        class="nav-link" 
        [class.active]="isActive('/organizations')"
        (click)="navigateTo('/organizations')">
        Organizations
      </a>
      <button class="btn-primary" *ngIf="(auth.isAuthenticated$ | async) === false" (click)="auth.login()">
        Login
      </button>
      <button class="btn-primary" *ngIf="(auth.isAuthenticated$ | async) === true" (click)="auth.logout()">
        Logout
      </button>
      <button class="btn-primary" *ngIf="(auth.isAuthenticated$ | async) === false" (click)="navigateTo('/auth/register')">
        Register
      </button>
    </nav>

    <!-- Mobile Menu Button -->
    <button class="menu-toggle" (click)="toggleMenu()">
      <svg *ngIf="!isMenuOpen" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="isMenuOpen" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <nav class="nav-mobile" [class.open]="isMenuOpen">
    <a class="nav-link-mobile" (click)="navigateTo('/dashboard')">Dashboard</a>
    <a class="nav-link-mobile" (click)="navigateTo('/events')">My Events</a>
    <a class="nav-link-mobile" (click)="navigateTo('/events')">Public Events</a>
    <button class="btn-primary-mobile" (click)="navigateTo('/events/create')">
      Create Event
    </button>
  </nav>
</header>
