<header class="header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo">
      <span class="material-icons logo-icon" (click)="toggleTheme()">event_note</span>
      <span class="logo-text" (click)="navigateTo('/')">Planify</span>
    </div>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop">
      <a 
        class="nav-link" 
        [class.active]="isActive('/events')"
        (click)="navigateTo('/events')">
        Events
      </a>
      <a 
        class="nav-link" 
        [class.active]="isActive('/dashboard')"
        (click)="navigateTo('/dashboard')">
        Dashboard
      </a>
      <a
        class="nav-link"
        *ngIf="( auth.hasAnyRole(['uporabnik']) | async) === true"
        (click)="navigateTo('/organizations/my')"
      >
        My Organizations
      </a>
      <a
        class="nav-link"
        *ngIf="( auth.hasAnyRole(['org_admin']) | async) === true"
        (click)="navigateTo('/organizations/admin')"
      >
        Organization Memberships
      </a>
      <button
        class="btn-create"
        (click)="navigateTo('/events/create')"
        *ngIf="true">
        <span class="material-icons">add</span>
        Create Event
      </button>
      <button class="btn-primary" *ngIf="(auth.isAuthenticated$ | async) === false" (click)="auth.login()">
        Login
      </button>
      <button class="btn-primary" *ngIf="(auth.isAuthenticated$ | async) === true" (click)="auth.logout()">
        Logout
      </button>
      <button class="btn-secondary" *ngIf="(auth.isAuthenticated$ | async) === false" (click)="navigateTo('/auth/register')">
        Register
      </button>
    </nav>

    <!-- Mobile Menu Button -->
    <button class="menu-toggle" (click)="toggleMenu()">
      <span class="material-icons" *ngIf="!isMenuOpen">menu</span>
      <span class="material-icons" *ngIf="isMenuOpen">close</span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <nav class="nav-mobile" [class.open]="isMenuOpen">
    <a class="nav-link-mobile" (click)="navigateTo('/dashboard')">
      <span class="material-icons">dashboard</span>
      Dashboard
    </a>
    <a class="nav-link-mobile" (click)="navigateTo('/events')">
      <span class="material-icons">calendar_today</span>
      My Events
    </a>
    <a class="nav-link-mobile" (click)="navigateTo('/events')">
      <span class="material-icons">public</span>
      Public Events
    </a>
      <a class="nav-link-mobile" *ngIf="(auth.hasAnyRole(['uporabnik']) | async) === true" (click)="navigateTo('/organizations/my')">My Organizations</a>
      <a class="nav-link-mobile" *ngIf="(auth.hasAnyRole(['org_admin']) | async) === true" (click)="navigateTo('/organizations/admin')">Organization Memberships</a>
      <button class="btn-primary-mobile" (click)="navigateTo('/events/create')">
      <span class="material-icons">add</span>
      Create Event
    </button>
  </nav>
</header>
