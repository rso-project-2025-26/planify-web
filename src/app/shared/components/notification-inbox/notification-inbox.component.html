<div class="notification-bell-container">
  <!-- Bell Icon -->
  <button class="notification-bell" (click)="togglePanel()" aria-label="Notifications">
    <span class="material-icons">notifications</span>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
  </button>

  <!-- Notification Panel -->
  <div class="notification-panel" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="panel-header">
      <h3>Notifications</h3>
      <div class="header-actions">
        <button 
          class="filter-btn" 
          [class.active]="showUnreadOnly"
          (click)="toggleUnreadFilter()"
          title="Show unread only">
          <span class="material-icons">filter_list</span>
        </button>
        <button 
          class="mark-all-btn" 
          (click)="markAllAsRead()"
          *ngIf="unreadCount > 0"
          title="Mark all as read">
          <span class="material-icons">done_all</span>
        </button>
      </div>
    </div>

    <!-- Notifications List -->
    <div class="notifications-list">
      <div *ngIf="loading && notifications.length === 0" class="loading-state">
        <app-loading-spinner></app-loading-spinner>
      </div>

      <div *ngIf="!loading && notifications.length === 0" class="empty-state">
        <span class="material-icons">notifications_none</span>
        <p>No notifications</p>
      </div>

      <div 
        *ngFor="let notification of notifications"
        class="notification-item"
        [class.unread]="!notification.isRead"
        (click)="handleNotificationClick(notification)">
        
<!--        <div class="notification-icon" [class]="'type-' + notification.type.toLowerCase()">-->
<!--          <span class="material-icons">{{ getNotificationIcon(notification.type) }}</span>-->
<!--        </div>-->

          <div class="notification-content">
              <div class="notification-header">
                  <h4 class="notification-title" [innerHTML]="notification.title"></h4>
                  <span class="notification-time">
      {{ getRelativeTime(notification.createdAt) }}
    </span>
              </div>
              <p class="notification-message" [innerHTML]="notification.message"></p>
          </div>

        <div class="notification-actions">
          <button 
            class="action-btn mark-read-btn" 
            *ngIf="!notification.isRead"
            (click)="markAsRead(notification, $event)"
            title="Mark as read">
            <span class="material-icons">circle</span>
          </button>
          <button 
            class="action-btn delete-btn" 
            (click)="deleteNotification(notification.id, $event)"
            title="Delete">
            <span class="material-icons">close</span>
          </button>
        </div>
      </div>

      <!-- Load More -->
      <div class="load-more" *ngIf="currentPage < totalPages - 1 && !loading">
        <button class="load-more-btn" (click)="loadMore()">
          Load more
        </button>
      </div>

      <div *ngIf="loading && notifications.length > 0" class="loading-more">
        <app-loading-spinner></app-loading-spinner>
      </div>
    </div>
  </div>
</div>

<div class="backdrop" *ngIf="isOpen" (click)="togglePanel()"></div>

<div class="notification-modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="notification-modal" (click)="$event.stopPropagation()" *ngIf="selectedNotification">
    <div class="modal-header">
      <div class="modal-title-section">
        <h2 [innerHTML]="selectedNotification.title"></h2>
      </div>
      <button class="modal-close-btn" (click)="closeModal()" aria-label="Close">
        <span class="material-icons">close</span>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="modal-time">
        <span class="material-icons">schedule</span>
        {{ selectedNotification.createdAt | date: 'medium' }}
      </div>
      <div class="modal-message" [innerHTML]="selectedNotification.message"></div>
    </div>
  </div>
</div>
