replicaCount: 2

image:
  repository: ghcr.io/rso-project-2025-26/planify-web
  tag: main
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: LoadBalancer
  port: 80
  targetPort: 80

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"